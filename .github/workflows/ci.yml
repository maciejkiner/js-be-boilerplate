name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # E2E przechodzi przez mailer (kreator projektu wysyła zaproszenia), a `SmtpMailer` bez
      # serwera SMTP kończy się 500. Lokalnie tę rolę pełni mailhog z docker-compose.
      mailhog:
        image: mailhog/mailhog:latest
        ports:
          - 1025:1025

    env:
      DATABASE_URL: postgres://app:app@localhost:5432/app
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/app

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated API client is up to date
        run: |
          pnpm generate:client
          git diff --exit-code apps/api/openapi.json packages/api-client/src/generated

      - name: Format check
        run: pnpm format:check

      - name: Apply migrations (test DB)
        run: pnpm --filter @repo/api db:migrate

      - name: Lint / typecheck / build / test
        run: pnpm turbo run lint typecheck build test

      - name: Install Playwright browser
        run: pnpm --filter @repo/e2e exec playwright install --with-deps chromium

      - name: E2E (Playwright — startuje API + web + admin)
        run: pnpm --filter @repo/e2e test:e2e
